    <title>걸즈밴드 체크리스트</title>
    <meta name="description" content="동인행사별 참가 서클과 통판 정보를 확인하고 방문 여부를 관리하는 체크리스트" />

  <body>
    <!-- 리퀴드 글래스 굴절 맵(#36) — .glass-refract가 backdrop-filter: url(#lg-refract)로 참조. Chromium 전용 -->
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
      <filter id="lg-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="2" seed="7" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="soft" />
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="40" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
