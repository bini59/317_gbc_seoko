name: CI

on:
  pull_request:
    paths-ignore:
      - '.codex/**'
  push:
    branches: [main]
    paths-ignore:
      - '.codex/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # node:sqlite (used by tests) requires Node >= 22.5
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
